version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    ignore:
      # @types/node stays on the lowest Node major the SDK supports
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
