name: Release

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ts-release: ${{ steps.rp.outputs['typescript--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-ts:
    needs: release-please
    if: needs.release-please.outputs.ts-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      # Trusted publishing needs npm >=11.5, newer than what Node 22 bundles.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: npm publish
